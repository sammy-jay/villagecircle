name: Scheduled jobs

# The Vercel free plan only runs cron once a day, so GitHub calls the frequent jobs instead.
# Set two repository secrets: APP_URL (for example https://villagecircle.org) and CRON_SECRET (the same value as on Vercel).
# GitHub may start scheduled runs a few minutes late, and pauses them after 60 days with no commits.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      APP_URL: ${{ secrets.APP_URL }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
    steps:
      - name: Skip until the secrets are set
        if: ${{ env.APP_URL == '' || env.CRON_SECRET == '' }}
        run: echo "APP_URL or CRON_SECRET is not set; nothing to do."
      - name: Sweeps and reminders
        if: ${{ env.APP_URL != '' && env.CRON_SECRET != '' }}
        run: |
          for job in sweeps reminders; do
            curl -fsS -H "Authorization: Bearer $CRON_SECRET" "$APP_URL/api/cron/$job" || echo "::warning::$job failed"
          done
      - name: Service windows (every 30 minutes)
        if: ${{ env.APP_URL != '' && env.CRON_SECRET != '' }}
        run: |
          minute=$(date -u +%M)
          if [ $((10#$minute % 30)) -lt 10 ]; then
            curl -fsS -H "Authorization: Bearer $CRON_SECRET" "$APP_URL/api/cron/service-windows" || echo "::warning::service-windows failed"
          fi
